
<!doctype html>
<!--
    Name:       Zachary Nguyen
    File:       homework4.html
    Date:       07/11/2026
    Purpose:    MIS Assignment 4 patient intake form. Builds on homework 3 and adds:
                Fetch API (state list loaded from states.html), an iFrame (clinic
                location map), content protection (sticky header + fixed footer),
                a first name tracking cookie with a returning user greeting, and
                Local Storage that saves/restores all non-secure form fields.
    Class:      MIS3371 | Professor Messinger | Assignment 4
-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Bayou City Family Clinic - Patient Intake</title>

        <!-- external CSS styles file (shared with earlier assignments) -->
        <link rel="stylesheet" href="style.css">

        <!-- Assignment 4 styles kept here so they don't change homework 1-3 pages.
             CONTENT PROTECTION: the header sticks to the top of the viewport while
             scrolling, and the footer is fixed to the bottom, so neither can be
             scrolled off screen. -->
        <style>
            #header {
                position: sticky;
                top: 0;
                background-color: white;
                z-index: 10;
            }

            #footer {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background-color: white;
                z-index: 10;
                margin: 0;
            }

            /* Leave room at the bottom so the fixed footer never covers content. */
            body {
                padding-bottom: 110px;
            }

            /* Cookie greeting in the header. */
            #welcome-msg {
                font-size: 20px;
                color: blue;
                display: block;
            }

            /* Dynamic "Not you?" new-user checkbox in the header. */
            #newuser-area {
                font-size: 16px;
                display: block;
            }
        </style>

    </head>

    <!-- initPage() loads the states via Fetch and checks the name cookie -->
    <body onload="initPage()">

        <!-- HEADER (protected: position sticky, never scrolls off the top) -->
        <div id="header">
        <table>
        <tr>
        <td>
        <img
            id="logo"
            src="hospitallogo.png"
            alt="Bayou City Family Clinic"
            height="150"
            >
        </td>
      <td valign="top">Bayou City Family Clinic
      <!-- Cookie greeting: "Welcome back, Jake!" or "Welcome, New User!" -->
      <span id="welcome-msg"></span>
      <!-- Dynamic checkbox added here by JS when a returning user is found -->
      <span id="newuser-area"></span>
      </td>
      <td valign="bottom" align="right">
      Today's date: <span id="today">Date goes here</span>
      </td>
      </tr>
      </table>
      </div>

      <hr>

      <!--BODY: Patient Intake Form-->
      <div id="body">
        <form action="thankyou.html" id="signup" onsubmit="return validateForm()">
        <table class="form">

        <!-- Form title -->
        <tr>
        <th class="form" colspan="2">Patient Intake Form</th>
        </tr>

        <!-- Email Address -->
        <tr>
        <td class="label">
        <label for="patient-email">Email</label>
        </td>
        <td class="field">
        <input
            type="text"
            id="patient-email"
            name="patient-email"
            size="15"
            maxlength="50"
            placeholder="Patient Email (req'd)"
            pattern="[^\s@]+@[^\s@]+\.[^\s@]+"
            title="Enter a valid email address, e.g. name@example.com"
            onblur="checkEmail(); saveLocal(this)"
            required
            oninvalid="this.setCustomValidity('Patient Email is required')"
            oninput="this.setCustomValidity(''); checkEmail()"
            >
        <br><span class="error" id="email-error"></span>
        </td>
        </tr>

       <!-- Patient ID -->
       <tr>
        <td class="label">
        <label for="patient-id">Patient ID</label>
        </td>
        <td class="field">
        <input
            type="text"
            id="patient-id"
            name="patient-id"
            size="15"
            maxlength="8"
            placeholder="PT-##### (req'd)"
            pattern="PT-[0-9]{5}"
            title="Patient ID format: PT- followed by 5 digits, e.g. PT-12345"
            onblur="checkID(); saveLocal(this)"
            required
            oninvalid="this.setCustomValidity('Patient ID is required')"
            oninput="this.setCustomValidity('')"
            >
        <br><span class="error" id="id-error"></span>
        </td>
        </tr>

        <!-- Password (SECURE: never saved to cookies or local storage) -->
        <tr>
        <td class="label">
        <label for="password">Password</label>
        </td>
        <td class="field">
        <input
            type="password"
            id="password"
            name="password"
            size="15"
            maxlength="30"
            placeholder="Password (req'd)"
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,30}"
            title="8-30 characters, with at least one uppercase letter, one lowercase letter, and one number"
            required
            oninvalid="this.setCustomValidity('Password is required')"
            oninput="this.setCustomValidity(''); checkPassword()"
            >
        <br><span class="error" id="password-error"></span>
        </td>
        </tr>

        <!-- Confirm Password (SECURE: never saved) -->
        <tr>
        <td class="label">
        <label for="password-confirm">Confirm Password</label>
        </td>
        <td class="field">
        <input
            type="password"
            id="password-confirm"
            name="password-confirm"
            size="15"
            maxlength="30"
            placeholder="Re-enter password (req'd)"
            title="Re-enter the same password to confirm"
            oninput="checkConfirm()"
            required
            >
        <br><span class="error" id="confirm-error"></span>
        </td>
        </tr>

        <!-- First, MI, Last Name -->
        <tr>
        <td class="label">
        <label for="firstname">First Name / </label>
        <label for="middlename">M.I./ </label>
        <label for="lastname">Last</label>
        </td>
        <td class="field">
        <input
            type="text"
            id="firstname"
            name="firstname"
            size="15"
            maxlength="30"
            placeholder="First (req'd)"
            pattern="[A-Za-z'-]{1,30}"
            title="First name, letters only"
            onblur="checkFirstname(); saveLocal(this)"
            required
            oninvalid="this.setCustomValidity('First Name is required')"
            oninput="this.setCustomValidity('')"
            >
        <input
            type="text"
            id="middlename"
            name="M.I"
            size="5"
            maxlength="1"
            placeholder="M.I.(opt)"
            pattern="[A-Za-z]?"
            title="Single middle initial (optional)"
            onblur="checkMI(); saveLocal(this)"
            oninput="checkMI()"
            >
        <input
            type="text"
            id="lastname"
            name="lastname"
            size="15"
            maxlength="30"
            placeholder="Last (req'd)"
            pattern="[A-Za-z'-]{1,30}"
            title="Last name, letters only"
            onblur="checkLastname(); saveLocal(this)"
            required
            oninvalid="this.setCustomValidity('Last Name is required')"
            oninput="this.setCustomValidity('')"
            >
            <br><span class="error" id="firstname-error"></span>
            <span class="error" id="mi-error"></span>
            <span class="error" id="lastname-error"></span>
        </td>
        </tr>

        <!-- Date of Birth -->
        <tr>
        <td class="label">
        <label for="dob">Date of Birth</label>
        </td>
        <td class="field">
        <input
            type="date"
            id="dob"
            name="dob"
            title="Select your date of birth (cannot be in the future)"
            onblur="checkDOB(); saveLocal(this)"
            >
        <br><span class="error" id="dob-error"></span>
        </td>
        </tr>

        <!-- Social Security Number (SECURE: obscured, never saved) -->
        <tr>
        <td class="label">
        <label for="ssn">Social Security #</label>
        </td>
        <td class="field">
        <input
            type="text"
            id="ssn"
            name="ssn"
            size="11"
            maxlength="11"
            placeholder="###-##-####"
            pattern="[0-9]{3}-[0-9]{2}-[0-9]{4}"
            title="Format: ###-##-#### (digits and dashes)"
            oninput="formatSSN()"
            onfocus="this.type='text'"
            onblur="checkSSN()"
            >
        <br><span class="error" id="ssn-error"></span>
        </td>
        </tr>

        <!-- Address -->
        <tr>
        <td class="label">
            <label for="address">Address Line 1</label>
        </td>
        <td class="field">
        <input
            type="text"
            id="address"
            name="address"
            size="30"
            maxlength="30"
            placeholder="Street Address"
            pattern="[A-Za-z0-9 .,#-]{5,30}"
            title="Enter your street address, e.g. 123 Main St"
            onblur="checkAddress(); saveLocal(this)"
            >
        <br><span class="error" id="address-error"></span>
        </td>
        </tr>

    <!-- Address Line 2 (optional) -->
    <tr>
    <td class="label">
    <label for="address2">Address Line 2</label>
    </td>
    <td class="field">
    <input
        type="text"
        id="address2"
        name="address2"
        size="30"
        maxlength="30"
        placeholder="Apt, suite, etc. (optional)"
        title="Optional. If used, 2 to 30 characters."
        onblur="checkAddress2(); saveLocal(this)"
        oninput="checkAddress2()"
        >
    <br><span class="error" id="address2-error"></span>
    </td>
    </tr>

        <!-- City, State, Zip, Code used from professors -->
        <tr>
        <td class="label">
        <label for="city">City / State / Zip</label>
        </td>
        <td class="field">
            <input
            type="text"
            id="city"
            name="city"
            size="20"
            maxlength="30"
            placeholder="City (req'd)"
            title="Required. City name, 2 to 30 letters."
            onblur="checkCity(); saveLocal(this)"
            oninput="checkCity()"
            >

            <!-- FETCH API: options below the blank one are loaded from
                 states.html by loadStates() in homework4.js -->
            <select id="state" name="state" title="Please choose a state (required)" onchange="checkState(); saveLocal(this)">
            <option value="">-- State --</option>
        </select>

        <input
            type="text"
            id="zip"
            name="zip"
            size="5"
            maxlength="5"
            placeholder="Zip"
            pattern="[0-9]{5}"
            title="5-digit ZIP code"
            onblur="checkZip(); saveLocal(this)"
            >
            <br><span class="error" id="city-error"></span>
            <span class="error" id="state-error"></span>
            <span class="error" id="zip-error"></span>
        </td>
        </tr>

        <!-- Phone -->
        <tr>
        <td class="label">
        <label for="phone">Phone</label>
        </td>
        <td class="field">
        <input
            type="text"
            id="phone"
            name="phone"
            size="12"
            maxlength="12"
            placeholder="###-###-####"
            pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
            title="Format: ###-###-#### (digits and dashes)"
            onblur="checkPhone(); saveLocal(this)"
            >
        <br><span class="error" id="phone-error"></span>
        </td>
        </tr>

         <!-- 6 Checkboxes: Reason for Visit -->
         <tr>
         <td class="label">Reason for Visit</td>
         <td class="field">

        <input type="checkbox" id="cb1" name="reason" value="Annual Checkup" onchange="saveLocal(this)">
        <label for="cb1">Annual Checkup</label>
        <br>

         <input type="checkbox" id="cb2" name="reason" value="Follow-up" onchange="saveLocal(this)">
         <label for="cb2">Follow-up Appointment</label>
         <br>

         <input type="checkbox" id="cb3" name="reason" value="New Symptoms" onchange="saveLocal(this)">
         <label for="cb3">New Symptoms / Illness</label>
         <br>

         <input type="checkbox" id="cb4" name="reason" value="Prescription Refill" onchange="saveLocal(this)">
         <label for="cb4">Prescription Refill</label>
         <br>

        <input type="checkbox" id="cb5" name="reason" value="Vaccination" onchange="saveLocal(this)">
        <label for="cb5">Vaccination / Immunization</label>
        <br>

        <input type="checkbox" id="cb6" name="reason" value="Other" onchange="saveLocal(this)">
        <label for="cb6">Other</label>
        <br>

        </td>
        </tr>

         <!-- Slider: Pain Scale -->
        <tr>
        <td class="label">
        <label for="pain-scale">Pain Level (0-10)</label>
        </td>
        <td class="field">
        0
        <input
        type="range"
        id="pain-scale"
        name="pain-scale"
        min="0"
        max="10"
        step="1"
        value="0"
        oninput="document.getElementById('pain-display').innerHTML = this.value"
        onchange="saveLocal(this)"
        >
        10 &nbsp; Selected: <span id="pain-display">0</span>
        </td>
        </tr>

<!-- Free-text description -->
<tr>
    <td class="label">
    <label for="symptoms">Describe Symptoms</label>
    </td>
    <td class="field">
    <textarea
        id="symptoms"
        name="symptoms"
        rows="3"
        cols="40"
        maxlength="500"
        placeholder="Briefly describe your symptoms or reason for visit (optional)"
        title="Optional. Up to 500 characters."
        onblur="saveLocal(this)"
        ></textarea>
    </td>
    </tr>

        <!-- COOKIE / LOCAL STORAGE control: Remember Me (checked by default).
             Unchecking it expires the name cookie and deletes all saved data. -->
        <tr>
        <td class="label">
        <label for="remember">Remember Me</label>
        </td>
        <td class="field">
        <input
            type="checkbox"
            id="remember"
            name="remember"
            checked
            onchange="applyRemember()"
            title="Uncheck to erase your saved info from this browser"
            >
        <label for="remember">Save my info on this computer for next time</label>
        </td>
        </tr>

       <!-- Review, Validate, Submit and Reset buttons -->
       <tr>
        <td colspan="2">
        <center>
        <input type="button" value="Review" onclick="reviewData()">
        &nbsp;&nbsp;&nbsp;&nbsp;
        <input type="button" value="Validate" onclick="validateForm()">
        &nbsp;&nbsp;&nbsp;&nbsp;
        <!-- Submit stays hidden until Validate finds zero errors -->
        <input type="submit" id="submitBtn" value="Submit" style="display:none">
        &nbsp;&nbsp;&nbsp;&nbsp;
        <input type="reset" value="Reset" onclick="clearReview()">
        <br><br>
        <span id="form-status"></span>
        </center>
        </td>
        </tr>

        <!-- Review output area (filled in by reviewData() in homework4.js) -->
        <tr>
        <td colspan="2">
        <div id="outputformdata"></div>
        </td>
        </tr>

        </table>
        </form>

        <!-- iFRAME: external, clickable content (interactive map of the
             clinic's location near the Texas Medical Center) -->
        <h3>Find Our Clinic</h3>
        <iframe
            src="https://maps.google.com/maps?q=Texas+Medical+Center,+Houston,+TX&z=14&output=embed"
            width="600"
            height="300"
            style="border: 2px solid blue;"
            title="Map of Bayou City Family Clinic location">
        </iframe>

        </div>

        <!-- FOOTER (protected: position fixed, never scrolls off the bottom) -->
        <div id="footer">
        <hr>
        Bayou City Family Clinic
        <p>
        <a href="mailto:info@bayoucityclinic.com">Contact Us</a>
        </p>
        </div>

        <!-- Fill in today's date -->
        <script>
            document.getElementById("today").innerHTML = new Date().toLocaleDateString();
        </script>

        <!-- external JavaScript file: validation + fetch + cookies + local storage -->
        <script src="homework4.js"></script>

    </body>
    <!-- End of file: homework4.html -->
</html>
